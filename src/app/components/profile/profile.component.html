<div class="profile-container">
  <h2>👤 Saját Profil</h2>

  <form (ngSubmit)="updateProfile()" class="profile-form">
    <div class="profile-row">
      <div class="profile-field">
        <label for="firstName">Vezetéknév:</label>
        <input type="text" id="firstName" [(ngModel)]="userProfile.firstName" name="firstName" required>
      </div>
      <div class="profile-field">
        <label for="lastName">Keresztnév:</label>
        <input type="text" id="lastName" [(ngModel)]="userProfile.lastName" name="lastName" required>
      </div>
    </div>

    <label for="email">E-mail:</label>
    <input type="email" id="email" [(ngModel)]="userProfile.email" name="email" readonly>

    <label for="phoneNumber">Telefonszám:</label>
    <input type="text" id="phoneNumber" [(ngModel)]="userProfile.phoneNumber" name="phoneNumber" required>

    <label for="address">Lakcím:</label>
    <input type="text" id="address" [(ngModel)]="userProfile.address" name="address" required>

    <label for="shippingAddress">Szállítási cím:</label>
    <input type="text" id="shippingAddress" [(ngModel)]="userProfile.shippingAddress" name="shippingAddress" required>

    <button type="submit">💾 Mentés</button>
  </form>

  <p *ngIf="successMessage" class="success-message">{{ successMessage }}</p>
</div>
