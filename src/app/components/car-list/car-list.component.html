<div class="car-list-container">
  <h2>Autómárkák és modellek</h2>

  <p *ngIf="carBrands.length === 0">Nincsenek elérhető autómárkák.</p>

  <ul>
    <li *ngFor="let brand of carBrands">
      <div class="brand-header" (click)="toggleModels(brand.id)">
        <strong>{{ brand.name }}</strong>
        <span class="toggle-icon">
          {{ isExpanded(brand.id) ? '▲' : '▼' }}
        </span>
      </div>

      <ul *ngIf="isExpanded(brand.id)">
        <li *ngFor="let model of brand.carModels">
          {{ model.name }} ({{ model.year }})
        </li>
      </ul>
    </li>
  </ul>
</div>
